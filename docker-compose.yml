services:
  barovik-postgres:
    image: postgres:18.1-bookworm
    container_name: barovik-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./migrations/002_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    restart: always

  app:
    build: .
    container_name: lab_app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=barovik-postgres
    depends_on:
      - barovik-postgres

volumes:
  postgres_data:
